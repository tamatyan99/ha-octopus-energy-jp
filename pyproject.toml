[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF100", "SIM102", "SIM118", "B905"]
# RUF003(全角文字): 日本語コメント混在のため除外
# DTZ(naive datetime): テストの日付リテラルで使用するため除外
# S(bandit): HAカスタム連携では未使用のため除外
ignore = ["RUF003", "DTZ", "S"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-homeassistant-custom-component は auto モード前提
# (strict だと autouse の async fixture と衝突する)
asyncio_mode = "auto"
