name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements_test.txt
      - run: ruff check --config pyproject.toml custom_components tests
      - run: ruff format --check --config pyproject.toml custom_components tests
      - run: python -m compileall -q custom_components
      # パッケージ全体のカバレッジゲート (statistics.py は未テストのため 80%)
      - run: python -m pytest tests/ -q --cov=custom_components.octopus_energy_jp --cov-fail-under=80
